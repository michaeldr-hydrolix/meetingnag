<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330" role="img" aria-label="Phone lock screen with a Pushover emergency alert that does not include the meeting title">
  <rect x="0" y="0" width="300" height="330" rx="12" fill="#f3f4f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect x="70" y="14" width="160" height="302" rx="26" fill="#1b1e27"/>
    <rect x="128" y="24" width="44" height="10" rx="5" fill="#000000"/>
    <text x="150" y="82" text-anchor="middle" font-size="38" font-weight="300" fill="#ffffff">10:00</text>
    <rect x="80" y="104" width="140" height="104" rx="13" fill="#f4f5f8"/>
    <text x="91" y="124" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="8.5" font-weight="600" fill="#a3121b">PUSHOVER · EMERGENCY</text>
    <text x="91" y="143" font-size="11.5" font-weight="700" fill="#141826">Meeting at 10:00 AM</text>
    <g font-size="10.5" fill="#3a3f4f">
      <text x="91" y="161">You have a meeting at</text>
      <text x="91" y="176">10:00 AM and haven't</text>
      <text x="91" y="191">confirmed on your Mac.</text>
    </g>
  </g>
</svg>
